<stop offset="50%" stop-color="#a855f7"/>
<stop offset="75%" stop-color="#22c55e"/>
<stop offset="100%" stop-color="#f59e0b"/>
</linearGradient>
</defs>
<rect x="60" y="40" width="200" height="200" rx="44" fill="#1e1e22" opacity="0.92"/>
<rect x="100" y="129" width="8" height="22" rx="4" fill="url(#stateGrad)"/>
<rect x="114" y="111" width="8" height="58" rx="4" fill="url(#stateGrad)"/>
<rect x="128" y="123" width="8" height="34" rx="4" fill="url(#stateGrad)"/>
<rect x="142" y="96" width="8" height="88" rx="4" fill="url(#stateGrad)"/>
<rect x="156" y="115" width="8" height="50" rx="4" fill="url(#stateGrad)"/>
<rect x="170" y="92" width="8" height="96" rx="4" fill="url(#stateGrad)"/>
<rect x="184" y="125" width="8" height="30" rx="4" fill="url(#stateGrad)"/>
<rect x="198" y="108" width="8" height="64" rx="4" fill="url(#stateGrad)"/>
<rect x="212" y="130" width="8" height="20" rx="4" fill="url(#stateGrad)"/>
</svg>
