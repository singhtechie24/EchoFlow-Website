<svg width="200" height="200" viewBox="60 40 200 200" xmlns="http://www.w3.org/2000/svg" role="img">
<title>EchoFlow app mark</title>
<desc>Standalone square EchoFlow mark: dark charcoal rounded tile with nine waveform bars in a red-to-orange gradient.</desc>
<defs>
<linearGradient id="stateGrad" gradientUnits="userSpaceOnUse" x1="100" y1="140" x2="220" y2="140">
<stop offset="0%" stop-color="#ef4444"/>
